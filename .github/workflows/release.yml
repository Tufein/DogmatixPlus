# Builds the APKs and publishes a GitHub release:
#  - when a version tag (v1.2.0) is pushed, or
#  - when a push changes docs/release-notes/ (or this file) and the version in
#    app/build.gradle.kts has notes (docs/release-notes/v<versionName>.md) but no release yet:
#    the release and its tag are created on the pushed commit.
# Public releases follow v1.0.0, v1.1.0, …, v1.9.0, v2.0.0. Every release is regular.
# The text is the notes file, with Android build metadata and SHA-256 checksums appended.
#
# Signing: with the repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD the release APK is signed with that key (the same
# key every time, so updates install in place). Without them public releases are refused. Local debug APKs use the
# runner's debug key.
name: Release

on:
  push:
    tags: ['v*']
    branches: [master]
    paths: ['docs/release-notes/**', '.github/workflows/release.yml', 'tools/release_policy.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version, and is it still to be released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
            if [ ! -f "docs/release-notes/$tag.md" ]; then
              echo "No docs/release-notes/$tag.md: nothing to publish."
              exit 0
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag is already released."
              exit 0
            fi
          fi
          apk_version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          version_code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)
          test "$tag" = "v$apk_version" || { echo "Tag and APK version disagree."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > releases-pages.json
          python3 -c 'import json; print(json.dumps([r for page in json.load(open("releases-pages.json")) for r in page]))' > releases.json
          python3 -m unittest discover -s tools -p 'test_release_policy.py'
          python3 tools/release_policy.py "$tag" "$version_code" releases.json
          echo "Publishing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            {
              echo "RELEASE_STORE_FILE=keystore/release.jks"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } > .env
            echo "Release APK signed with the repository key."
          else
            echo "Release signing secrets are required. Refusing to publish an incompatible APK."
            exit 1
          fi

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Verify release identity
        run: |
          EXPECTED_CERT=$(cat .github/release-cert-sha256.txt)
          test -n "$EXPECTED_CERT" || { echo "Trusted release certificate fingerprint is required."; exit 1; }
          APK=app/build/outputs/apk/release/app-release.apk
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          normalize() { tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]'; }
          test "$(printf '%s' "$CERT" | normalize)" = "$(printf '%s' "$EXPECTED_CERT" | normalize)" || { echo "Release certificate mismatch."; exit 1; }
          test "v$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)" = "$TAG" || { echo "Tag and APK version disagree."; exit 1; }

      - name: Collect APKs and notes
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DogmatixPlus-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/DogmatixPlus-release.apk
          (cd dist && sha256sum DogmatixPlus-release.apk DogmatixPlus-debug.apk > SHA256SUMS.txt)
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then cp "$notes" dist/notes.md; else echo "DogmatixPlus $TAG. See CHANGELOG.md." > dist/notes.md; fi
          {
            echo
            VERSION_CODE=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)
            VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
            echo "<!-- dogmatix-release: {\"versionCode\":$VERSION_CODE,\"versionName\":\"$VERSION_NAME\"} -->"
            echo
            echo "Source: commit \`${GITHUB_SHA::7}\`."
            echo
            echo '### Checksums (SHA-256)'
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DogmatixPlus ${{ env.TAG }}
          body_path: dist/notes.md
          prerelease: false
          make_latest: "true"
          files: |
            dist/DogmatixPlus-debug.apk
            dist/DogmatixPlus-release.apk
            dist/SHA256SUMS.txt
