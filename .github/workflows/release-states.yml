# Sets which releases are shown, when this file changes (or by hand):
#  - whole versions (x.0.0) stay normal releases,
#  - half versions (x.5.0) become pre-releases,
#  - the versions in between become drafts, which only the repository owner can see.
# A draft can be published again from its release page. Versions not listed here are left alone.
# It also points the tags in TAG_MOVES (tag:old:new) at their rewritten commits and updates the
# "Source: commit" line of those releases.
name: Release states

on:
  push:
    branches: ['**']
    paths: ['.github/workflows/release-states.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  states:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASES: v1.0.0 v2.0.0 v3.0.0
      PRE_RELEASES: v2.5.0 v3.5.0
      DRAFTS: v1.1.0-beta.1 v1.2.0-alpha.1 v1.2.0 v1.3.0 v2.6.0 v3.1.0 v3.2.0 v3.3.0
      TAG_MOVES: >-
        v3.1.0:6793c1671e004668055a25ab98d0b989e9d738e2:6162b5ae8941049634a0e44a9644fd29afbe1f66
        v3.2.0:1ebc77d9286bcba62a34c3e985512f7c912c6e1d:57afd762158b23f67d5b9cd4f14f866f2edf1a23
        v3.3.0:07f1b24bb4b2229ea318c1a6737daa3c5b39c262:fec2fe35b25668344447e403e634d87274662908
        v3.5.0:8548635ea4cd33def5d9739d8a3d12a8b5ec4d9c:9daad33781e2b9ce933fa1ff6eca88c2ff0b2b42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the tags
        run: |
          for move in $TAG_MOVES; do
            IFS=: read -r tag old new <<< "$move"
            if [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$new" ]; then
              git push --force origin "$new:refs/tags/$tag"
            fi
            gh release view "$tag" --json body --jq .body > notes.md
            if grep -q "${old:0:7}" notes.md; then
              sed -i "s/${old:0:7}/${new:0:7}/g" notes.md
              gh release edit "$tag" --notes-file notes.md
            fi
          done

      - name: Set the release states
        run: |
          for tag in $RELEASES; do gh release edit "$tag" --draft=false --prerelease=false; done
          for tag in $PRE_RELEASES; do gh release edit "$tag" --draft=false --prerelease; done
          for tag in $DRAFTS; do gh release edit "$tag" --draft; done
          gh release list --limit 50
